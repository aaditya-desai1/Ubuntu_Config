name: CI – Build, Test & Publish Ubuntu Bootstrap Image

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read
  packages: write   # REQUIRED for GHCR push

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ubuntu-bootstrap-ci .

      - name: Run setup + verify in same container
        run: |
          docker run --rm \
            -e CI=true \
            ubuntu-bootstrap-ci \
            bash -c "
              set -e
              cd Ubuntu_Setup
              chmod +x setup.sh
              ./setup.sh

              echo '--- VERIFYING TOOLS ---'
              export PATH=\$HOME/.local/bin:\$PATH
              command -v git
              command -v zsh
              command -v fzf
              command -v nvim
              nvim --version
            "
      - name: Tag image for GHCR
        run: |
          IMAGE=ghcr.io/aaditya-desai1/ubuntu-bootstrap:latest
          docker tag ubuntu-bootstrap-ci $IMAGE
          echo "Tagged $IMAGE"

      - name: Push image to GHCR
        run: |
          IMAGE=ghcr.io/aaditya-desai1/ubuntu-bootstrap:latest
          docker push $IMAGE
