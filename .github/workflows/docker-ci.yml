name: CI – Build & Publish Ubuntu Bootstrap Image

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ubuntu-bootstrap .

      - name: Verify baked image
        run: |
          docker run --rm ubuntu-bootstrap bash -c "
            echo '--- VERIFYING TOOLS ---'
            command -v git
            command -v zsh
            command -v fzf
            command -v nvim
            nvim --version
          "

      - name: Push image
        run: |
          IMAGE=ghcr.io/aaditya-desai1/ubuntu-bootstrap:latest
          docker tag ubuntu-bootstrap $IMAGE
          docker push $IMAGE
